<!doctype html>
<html><head><meta charset="utf-8"><title>A&amp;P I — Quiz 6 Retake</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:32px auto;padding:0 20px;line-height:1.45;background:#f7f7f8;color:#171717}
.card{background:white;padding:20px;margin:16px 0;border-radius:12px;border:1px solid #ddd}
label{display:block;padding:7px;margin:3px 0;border-radius:6px} label:hover{background:#f1f1f1}
button{font-size:16px;padding:11px 18px;margin:10px 8px 10px 0;cursor:pointer}
#score{font-size:22px;font-weight:bold;margin:18px 0} .right{background:#dcfce7} .wrong{background:#fee2e2}
small{color:#555}
</style></head><body>
<h1>A&amp;P I — Quiz 6 Retake</h1>
<p>Offline retake quiz. Select one answer per question, then click <b>Grade Quiz</b>.</p>
<p><small>Reconstructed from your saved Quiz 6 question bank. Course-specific keys are preserved where known.</small></p>
<div id="quiz"></div>
<button onclick="grade()">Grade Quiz</button><button onclick="resetQuiz()">Retake / Reset</button>
<div id="score"></div>
<script>
const qs=[{"q": "Which of the following is a function of the integumentary system?", "opts": ["Protection", "Blood cell production", "Calcium storage", "Movement of bones"], "a": 0}, {"q": "Which epidermal cells function as tactile receptors?", "opts": ["Keratinocytes", "Tactile (Merkel) cells", "Melanocytes", "Dendritic cells"], "a": 1}, {"q": "Thick skin contains which epidermal layer that is absent from most thin skin?", "opts": ["Stratum basale", "Stratum spinosum", "Stratum lucidum", "Stratum granulosum"], "a": 2}, {"q": "The papillary layer of the dermis is primarily composed of", "opts": ["areolar connective tissue", "dense regular connective tissue", "adipose tissue", "cartilage"], "a": 0}, {"q": "Which pigments/components contribute to normal skin color?", "opts": ["Melanin, carotene, and hemoglobin", "Keratin, collagen, and elastin", "Calcium, phosphate, and iron", "Sebum, sweat, and cerumen"], "a": 0}, {"q": "Lines of cleavage in the skin reflect the orientation of", "opts": ["collagen fibers in the dermis", "hair follicles", "sweat glands", "epidermal ridges"], "a": 0}, {"q": "The subcutaneous (hypodermal) layer is composed mainly of", "opts": ["areolar and adipose tissue", "dense regular connective tissue", "cartilage and bone", "keratinized epithelium"], "a": 0}, {"q": "Why can the skin become pale in cold conditions?", "opts": ["Dermal blood vessels constrict", "Melanin production stops", "Sweat glands enlarge", "Keratin is lost"], "a": 0}, {"q": "Contraction of the arrector pili muscles causes", "opts": ["goose bumps", "sweating", "nail growth", "vasodilation"], "a": 0}, {"q": "Nails are hard keratin structures formed from the stratum _____ of the epidermis. (Course key)", "opts": ["basale", "spinosum", "granulosum", "corneum"], "a": 3}, {"q": "Apocrine sweat glands are most associated with", "opts": ["axillary and anogenital regions", "palms and soles only", "the nail bed", "the epidermis only"], "a": 0}, {"q": "Cerumen (earwax) is produced by modified", "opts": ["sweat glands", "sebaceous glands only", "hair follicles", "tactile cells"], "a": 0}, {"q": "A common change in aging skin is", "opts": ["reduced elasticity and thinner skin", "increased collagen production", "more active sebaceous glands", "thickening of all epidermal layers"], "a": 0}, {"q": "Sebaceous glands are generally absent from", "opts": ["palms and soles", "the scalp", "the face", "the back"], "a": 0}, {"q": "The rule of nines is used to estimate", "opts": ["percentage of body surface burned", "skin cancer stage", "sweat production", "epidermal thickness"], "a": 0}, {"q": "Which is the most common type of skin cancer?", "opts": ["Basal cell carcinoma", "Melanoma", "Kaposi sarcoma", "Osteosarcoma"], "a": 0}, {"q": "UV exposure helps the skin begin production of", "opts": ["cholecalciferol (vitamin D3)", "vitamin C", "vitamin B12", "calcitonin"], "a": 0}, {"q": "The most abundant cells of the epidermis are", "opts": ["keratinocytes", "melanocytes", "tactile cells", "dendritic cells"], "a": 0}, {"q": "What is not true of thick skin? (Course-specific key)", "opts": ["It is found on palms and soles", "It contains a stratum lucidum", "B and C are not true", "It has a thicker epidermis than thin skin"], "a": 2}, {"q": "Cyanosis is a bluish skin discoloration commonly associated with", "opts": ["low oxygenation of hemoglobin", "excess carotene", "increased melanin", "high calcium"], "a": 0}, {"q": "The hypodermis is clinically useful because it", "opts": ["contains adipose tissue and can serve as a site for subcutaneous injections", "is part of the epidermis", "contains no blood vessels", "forms the stratum corneum"], "a": 0}, {"q": "To conserve heat, cutaneous blood vessels generally", "opts": ["constrict", "dilate", "rupture", "form new capillaries"], "a": 0}, {"q": "The portion of a hair projecting above the skin surface is the", "opts": ["shaft", "root", "bulb", "papilla"], "a": 0}, {"q": "The eponychium is commonly called the", "opts": ["cuticle", "nail bed", "lunula", "nail root"], "a": 0}, {"q": "The primary function of sweat glands is", "opts": ["thermoregulation", "bone growth", "blood cell production", "melanin synthesis"], "a": 0}, {"q": "A full-thickness burn that destroys the epidermis and dermis is a", "opts": ["third-degree burn", "first-degree burn", "superficial abrasion", "contusion"], "a": 0}, {"q": "Using the adult rule of nines, the head and neck account for approximately", "opts": ["9%", "18%", "27%", "36%"], "a": 0}];
const root=document.getElementById('quiz');
qs.forEach((x,i)=>{
 let d=document.createElement('div'); d.className='card'; d.id='q'+i;
 d.innerHTML=`<b>${i+1}. ${x.q}</b>`+x.opts.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('');
 root.appendChild(d);
});
function grade(){
 let score=0;
 qs.forEach((x,i)=>{
  let card=document.getElementById('q'+i); card.querySelectorAll('label').forEach(l=>l.classList.remove('right','wrong'));
  let s=document.querySelector(`input[name=q${i}]:checked`);
  card.querySelectorAll('label')[x.a].classList.add('right');
  if(s){ if(+s.value===x.a) score++; else s.parentElement.classList.add('wrong'); }
 });
 document.getElementById('score').textContent=`Score: ${score} / ${qs.length} (${Math.round(score/qs.length*100)}%)`;
 window.scrollTo(0,document.body.scrollHeight);
}
function resetQuiz(){document.querySelectorAll('input').forEach(x=>x.checked=false);document.querySelectorAll('label').forEach(l=>l.classList.remove('right','wrong'));document.getElementById('score').textContent='';window.scrollTo(0,0);}
</script></body></html>
