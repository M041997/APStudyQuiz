<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A&amp;P I Study Tool</title>
<style>
  :root{
    --bg:#f2f3f5; --card:#ffffff; --line:#d9dce1; --ink:#1a1c1f;
    --accent:#2563eb; --accent-soft:#e8f0fe; --right:#dcfce7; --wrong:#fde2e2;
    --right-ink:#14532d; --wrong-ink:#7f1d1d; --muted:#5c626d; --hintbg:#fff7e1; --hintline:#f5e4a8;
  }
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
       max-width:860px;margin:0 auto;padding:22px 16px 90px;line-height:1.5;
       background:var(--bg);color:var(--ink)}
  h1{font-size:23px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .tabs{display:flex;gap:8px;margin:16px 0 12px;flex-wrap:wrap}
  /* Chapter picker: one card per chapter, plus the exams that pool chapters. */
  .chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:18px 0 16px}
  .chap{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;transition:.15s}
  .chap:hover{border-color:var(--accent)}
  .chap.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
  .chap-main{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;cursor:pointer;padding:16px 16px 12px;flex:1}
  .chap-main:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .chap-eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .chap-num{display:block;font-size:34px;font-weight:800;line-height:1.1;margin:2px 0 2px;color:var(--ink)}
  .chap-name{display:block;font-size:16px;font-weight:600;color:var(--ink)}
  .chap-counts{display:block;font-size:12.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
  .chap.active .chap-num{color:var(--accent)}
  .chap-retake{display:block;padding:9px 16px;border-top:1px solid var(--line);font-size:13px;font-weight:600;
               color:var(--accent);text-decoration:none;background:var(--accent-soft)}
  .chap-retake:hover,.chap-retake:focus-visible{text-decoration:underline}
  .tab{flex:1;min-width:200px;padding:12px 14px;border:1px solid var(--line);
       border-radius:12px;background:#fff;cursor:pointer;text-align:left;transition:.15s}
  .tab:hover{border-color:var(--accent)}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tab small{display:block;font-weight:normal;opacity:.75;font-size:12px}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
           background:#fff;border:1px solid var(--line);border-radius:12px;
           padding:10px 12px;margin-bottom:14px;position:sticky;top:8px;z-index:5}
  button{font-family:inherit;font-size:14px;padding:9px 13px;border-radius:8px;
         border:1px solid var(--line);background:#fff;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{filter:brightness(1.06)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .badge{font-size:13px;font-weight:600;margin-left:auto;color:var(--muted);text-align:right}
  /* Toolbar: what to study, then what to do, then the settings nobody changes often. */
  .toolbar{flex-direction:column;align-items:stretch}
  .tb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:9px 14px;font-weight:600;color:var(--muted)}
  .seg button:last-child{border-right:0}
  .seg button:hover{color:var(--accent)}
  .seg button.on{background:var(--accent);color:#fff}
  .seg button small{font-weight:500;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
  .tb-more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);width:max-content;padding:2px 0}
  .tb-more summary:hover{color:var(--accent)}
  .tb-more[open] summary{margin-bottom:8px}
  .badge b{color:var(--ink)}
  .hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;text-align:center;margin-top:6px}
  .hero p{color:var(--muted);max-width:520px;margin:10px auto 18px}
  .hero .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .stat{display:flex;gap:16px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
  .stat div{background:var(--accent-soft);border-radius:10px;padding:10px 16px;min-width:120px}
  .stat b{display:block;font-size:22px;color:var(--accent)}
  .stat span{font-size:12px;color:var(--muted)}
  .card{background:var(--card);padding:16px 18px 14px;margin:12px 0;border-radius:12px;border:1px solid var(--line)}
  .card .q{font-weight:600;margin-bottom:12px}
  .q .num{color:var(--muted);font-weight:600;margin-right:6px}
  .ptype{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
         padding:2px 7px;border-radius:99px;background:#eef0f3;color:var(--muted);margin-left:8px;vertical-align:middle}
  label{display:block;padding:8px 10px;margin:4px 0;border-radius:8px;cursor:pointer;border:1px solid transparent}
  label:hover{background:var(--accent-soft)}
  label.right{background:var(--right);color:var(--right-ink);border-color:#86efac}
  label.wrong{background:var(--wrong);color:var(--wrong-ink);border-color:#fca5a5}
  label.correct-mark{box-shadow:inset 0 0 0 2px #22c55e}
  .hint-btn{font-size:12px;padding:5px 10px;margin-top:6px;background:none;border:1px dashed #d0b54a;color:#8a6d1d}
  .hint-btn:hover{border-color:#8a6d1d;color:#6b540f}
  .flag-btn{font-size:12px;padding:5px 10px;margin-top:6px;background:none;border:1px dashed #9aa7b4;color:#5b6673}
  .flag-btn:hover{border-color:var(--accent);color:var(--accent)}
  .flag-btn.on{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);font-weight:600}
  .hint{display:none;margin:8px 0 0;padding:10px 12px;border-radius:8px;
        background:var(--hintbg);border:1px solid var(--hintline);font-size:14px;color:#6b540f}
  .hint.shown{display:block}
  select{font-family:inherit;font-size:14px;padding:9px 10px;border-radius:8px;
         border:1px solid var(--line);background:#fff;cursor:pointer;color:inherit}
  select:hover{border-color:var(--accent)}
  .summary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:14px}
  .summary h3{margin:0 0 4px}
  .summary .big{font-size:30px;font-weight:700;color:var(--accent)}
  .missed-item{background:#fffaf0;border:1px solid #efe0b8;border-radius:10px;padding:12px 14px;margin:10px 0}
  .missed-item .mq{font-weight:600}
  .missed-item .ans{color:var(--right-ink);margin-top:6px}
  .missed-item .ans b{color:var(--right-ink)}
  .tag{font-size:11px;color:var(--muted);font-style:italic}
  .muted{color:var(--muted)}
  .fb{margin-top:12px;padding:10px 12px;border-radius:8px;font-weight:600}
  .fb.ok{background:var(--right);color:var(--right-ink);border:1px solid #86efac}
  .fb.bad{background:var(--wrong);color:var(--wrong-ink);border:1px solid #fca5a5}
  .fb small{display:block;font-weight:400;margin-top:4px;opacity:.9}
  label.locked{cursor:default;opacity:.75}
  .progress{height:6px;background:#e3e6ea;border-radius:99px;overflow:hidden;margin:2px 0 10px}
  .progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .aids{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:#eef5ff;border:1px solid #cfe1f7}
  .aids.shown{display:block}
  .aids-h{font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:#1e40af;margin-bottom:6px}
  .aid{display:flex;gap:8px;margin:7px 0;font-size:14px;line-height:1.45}
  .aid-k{flex:0 0 46px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#1e40af;padding-top:3px}
  .aid-v{flex:1}
  .trapbox{margin-top:10px;padding:9px 11px;border-radius:8px;background:#fff8e6;border:1px solid #efdc9f;font-size:13.5px;color:#6b540f}
  .aids-btn{font-size:12px;padding:6px 11px;margin-top:8px;background:none;border:1px dashed #7aa7e0;color:#1e40af;border-radius:8px}
  .aids-btn:hover{border-color:#1e40af;color:#1e40af}
  .review .ans{color:var(--right-ink);font-weight:700;margin-top:8px}
  .keyopt{padding:5px 10px;margin:3px 0;border-radius:8px;font-size:14px;color:var(--muted)}
  .keyopt.ok{background:var(--right);color:var(--right-ink);font-weight:700;border:1px solid #86efac}
  .keywhy{margin-top:8px;font-size:13px;color:var(--muted)}
  .toolbar label{display:inline-flex;align-items:center;gap:6px;padding:0;margin:0;border:0;border-radius:0;
                 font-size:13px;color:var(--muted);cursor:pointer}
  .toolbar label:hover{background:none}
  @media print{ .toolbar,.tabs,.chapters,.hint-btn,.aids-btn,.flag-btn{display:none!important} .hint,.aids{display:block!important} }
</style>
</head>
<body>
<h1>A&amp;P I Study Tool</h1>
<p class="sub">Every question comes from the real quizzes, the HW6 / HW7 homework, or the lecture PowerPoints, and shows its source. Pick a chapter and a section, then press <b>▶ Start</b>. Anything you miss comes back in <b>🧠 Missed review</b>. Progress is saved in this browser.</p>

<div class="chapters" id="chapters" aria-label="Chapters"></div>

<div class="toolbar">
  <div class="tb-row">
    <div class="seg" id="srcseg" role="group" aria-label="Which questions">
      <button type="button" data-src="real" onclick="setFilter('real')">Quiz</button>
      <button type="button" data-src="hw" onclick="setFilter('hw')">Homework</button>
      <button type="button" data-src="lecture" onclick="setFilter('lecture')">PowerPoint</button>
      <button type="button" data-src="all" onclick="setFilter('all')">All</button>
    </div>
    <select id="attemptsel" onchange="setAttempt(this.value)" title="Narrow the quiz questions to one quiz attempt"></select>
    <select id="sizesel" onchange="setSize(this.value)" title="How many questions a Start round draws. Practice missed and Retry marked always serve the whole set.">
      <option value="5">5 questions</option>
      <option value="10">10 questions</option>
      <option value="20">20 questions</option>
      <option value="all">All of them</option>
    </select>
  </div>
  <div class="tb-row">
    <button id="btn-new" class="primary" onclick="start('mixed')">▶ Start</button>
    <button id="btn-missed" onclick="start('missed')">🎯 Practice missed</button>
    <button id="btn-flagged" data-retry data-hide-empty onclick="start('flagged')" title="Run only the questions you ticked Retry only this one, reshuffled every time, so you can loop them.">🔁 Retry marked</button>
    <button onclick="startReview()" title="Every question you have missed, with its explanation">🧠 Missed review</button>
    <button onclick="startKey()" title="Every question in this section with the correct answer marked - nothing to answer, just read">📖 Answer key</button>
    <span class="badge" id="badge"></span>
  </div>
  <details class="tb-more">
    <summary>⚙ Options</summary>
    <div class="tb-row">
      <select id="modesel" onchange="setMode(this.value)" title="How the questions are run">
        <option value="round">Answer all, then check</option>
        <option value="drill">Retry each until correct</option>
      </select>
      <label title="Show the explanation on every question before you answer">
        <input type="checkbox" id="aidscb" onchange="setAidsAlways(this.checked)"> Show aids while answering
      </label>
      <label title="Each fresh round serves the questions this section has not asked yet. Untick for a pure random draw.">
        <input type="checkbox" id="newfirstcb" onchange="setNewFirst(this.checked)"> New questions first
      </label>
      <label title="Serve the questions in a different order each session">
        <input type="checkbox" id="shufqcb" onchange="setShuffleQ(this.checked)"> Shuffle questions
      </label>
      <label title="Move the answer choices around, so the right answer is not always the same letter">
        <input type="checkbox" id="shufccb" onchange="setShuffleChoices(this.checked)"> Shuffle choices
      </label>
      <button onclick="clearProgress()" title="Erase saved progress in this browser">Reset progress</button>
    </div>
  </details>
</div>

<div id="content"></div>

<script>
/* ================= DATA ================= */


const DATA = {

q6: {
  label: "Chapter 6 — Integumentary System",
  mcq: [
    /* ---------- Real Quiz 6 test bank (16 items, each attempt; 6 shared) ---------- */
    {q:"Which is not a function of the integument?", opts:["Protection","Water loss prevention","Synthesis of cholecalciferol (vitamin D precursor)","Temperature regulation","No exceptions; all are functions of the integument"], correct:"No exceptions; all are functions of the integument", hint:"Every listed item really is an integument function, so the keyed answer is the no-exceptions option.", mnem:"Every listed item is a real job: protection, water seal, vitamin D, heat control. When the exam lists only genuine functions, the answer is 'no exceptions'.", trap:"Do not hunt for a fake function. If all the listed jobs are real, the trap is assuming one of them must be wrong.", src:"Quiz 6 · Attempt 1"},
    {q:"Tactile (Merkel) cells are sensitive to ______", opts:["touch","heat","sound / vibration","light","cold"], correct:"touch", hint:"Merkel cells are the epidermis light-touch receptors.", mnem:"MERKEL = 'MERRY tickle' - light touch. Say it: Merkel tickles, Meissner tickles, Pacinian presses.", trap:"'Sound / vibration' belongs to deep receptors. Heat and cold are free nerve endings, not Merkel cells.", src:"Quiz 6 · Attempt 1"},
    {q:"Thick skin contains ______", opts:["seven epidermal strata and lacks sweat glands","six epidermal strata and lacks sweat glands","four epidermal strata and lacks sebaceous glands","five epidermal strata and lacks sweat glands","five epidermal strata and lacks sebaceous glands"], correct:"five epidermal strata and lacks sebaceous glands", hint:"Thick skin has five strata, no hair follicles and no sebaceous glands — but it does have sweat glands. Read every option closely.", mnem:"Five strata, no SEBaceous glands, no hair - but it DOES sweat. Say: 'Five, bald and dry, still sweaty.'", trap:"Watch the near-twins. 'Five strata and lacks sweat glands' is wrong: thick skin is full of sweat glands. It lacks sebaceous glands.", src:"Quiz 6 · Attempt 1"},
    {q:"What is not true about the Dermal Papillary layer?", opts:["contains Meissner corpuscles for touch sensation","blends with or is adjacent to the hypodermis","contains capillaries to support the epidermis","produces the epidermal ridges seen on the skin's surface"], correct:"blends with or is adjacent to the hypodermis", hint:"The papillary layer is the superficial dermis; it is the reticular layer that sits next to the hypodermis.", mnem:"PAPillary = the PEAK (top), sitting under the epidermis. The RETicular layer is the one that RETreats down to the hypodermis.", trap:"The two dermal layers are easy to swap. Papillary = superficial + areolar. Reticular = deep + dense irregular.", src:"Quiz 6 · Attempts 1 and 2"},
    {q:"In good health, skin color results from a combination of  a: melanin   b: hemoglobin   c: bilirubin   d: carotene", opts:["a, c, d","a, b, c","a, b, d","a, d","b, c, d"], correct:"a, b, d", hint:"Melanin, hemoglobin and carotene are the normal contributors; bilirubin shows up only with jaundice.", mnem:"Healthy color = M, H, C: Melanin, Hemoglobin, Carotene. BILIRUBIN is the BAD one - it means jaundice.", trap:"Any answer option containing 'c: bilirubin' is wrong. A healthy person's skin color does not come from bilirubin.", src:"Quiz 6 · Attempt 1"},
    {q:"For optimum wound healing, surgical incisions should be planned ______", opts:["with no regard for lines of cleavage","parallel to lines of cleavage","perpendicular to lines of cleavage","away from any lines of cleavage"], correct:"parallel to lines of cleavage", hint:"Cutting parallel to the collagen bundles means less pulling, so the incision heals with less scarring.", mnem:"Cut WITH the grain, like wood. Parallel to the cleavage lines = less pull = less scar.", trap:"'Perpendicular' sounds more precise, but it slices across the collagen bundles so the wound pulls open.", src:"Quiz 6 · Attempts 1 and 2"},
    {q:"What is the composition of the subcutaneous layer?", opts:["Areolar and adipose connective tissue","Areolar connective tissue","Adipose connective tissue","Areolar connective tissue and dense irregular connective tissue","Dense irregular connective tissue"], correct:"Areolar and adipose connective tissue", hint:"The hypodermis is loose areolar connective tissue plus fat.", mnem:"Hypodermis = AREOLAR plus ADIPOSE: the loose connective tissue plus the fat. Two tissues, one layer.", trap:"Single-tissue options are half answers. If an option says only areolar, or only adipose, it is incomplete.", src:"Quiz 6 · Attempt 1"},
    {q:"Why might someone become pale when they are exposed to a cold temperature?", opts:["Dehydration of the stratum corneum","Purely psychological reasons","Vasodilation has occurred","Vasoconstriction has occurred","Constriction of the dermal collagen and elastic fibers"], correct:"Vasoconstriction has occurred", hint:"Cold narrows the dermal blood vessels, so less red blood shows through the skin.", mnem:"COLD goes with CONSTRICT - both start with C. Blood stays deep, skin looks pale. Heat does the opposite: dilate, flush, red.", trap:"Do not pick vasodilation. That is what makes you red and flushed when you are hot.", src:"Quiz 6 · Attempt 1"},
    {q:"The structure responsible for pulling on the follicle and causing goose bumps is the ______", opts:["external root sheath","arrector pili muscle","epithelial root sheath","internal root sheath","papilla"], correct:"arrector pili muscle", hint:"A tiny smooth muscle attached to each hair follicle.", mnem:"ARRECTOR PILI = 'a RECTOR pulls the PILI (hairs)'. A tiny muscle that RECTifies your hair.", trap:"The root sheaths and the papilla are hair structures too, but only the arrector pili is muscle, and only muscle can pull.", src:"Quiz 6 · Attempt 1"},

    {q:"Nails are hard keratin structures formed from the stratum ______ of the epidermis.", opts:["lucidum","basale","granulosum","spinosum","corneum"], correct:"corneum", hint:"Hard keratin means the most superficial, keratin-packed layer.", mnem:"Nails are the same hard dead keratin as the skin's OUTERMOST layer. Outer layer = corneum.", trap:"The basale is the deepest living layer. Nothing down there is hard keratin.", src:"Quiz 6 · Attempt 1"},
    {q:"The type of gland that secretes foul smelling sweat into a hair follicle, found in the axillary, anal, and genital regions, is the ______ sweat gland.", opts:["merocrine / eccrine","sebaceous","ceruminous","apocrine"], correct:"apocrine", hint:"Apocrine glands empty into hair follicles of the axillae and anogenital region.", mnem:"APOcrine = 'A Positive Odor'. Body odor, in hairy places, emptied into a hair follicle.", trap:"Eccrine and merocrine are the all-over cooling glands with their own pores. Apocrine is the smelly axilla and groin gland.", src:"Quiz 6 · Attempt 1"},
    {q:"Cerumen wax is a secretion that ______", opts:["cools the body through water evaporation","lubricates the ear canal and traps debris before it reaches the eardrum","tends to cause acne on the skin of the face","lubricates vellus hairs and waterproofs the skin of the limbs","acts as a pheromone"], correct:"lubricates the ear canal and traps debris before it reaches the eardrum", hint:"The ceruminous glands protect the ear canal.", mnem:"CERUMEN = 'CARE-umen' - it CAREs for the ear canal by lubricating it and trapping debris.", trap:"Water evaporation is sweat's job, not earwax's. Cerumen lubricates and traps; it does not cool.", src:"Quiz 6 · Attempts 1 and 2"},
    {q:"What changes are not expected with aging skin?", opts:["skin gets thinner and injures easier","wrinkles and crease lines develop where skin folds","wounds take longer to heal","thick skin regions get thicker due to epidermal overgrowth","collagen fibers decrease, elastic fibers become stiff"], correct:"thick skin regions get thicker due to epidermal overgrowth", hint:"Aging skin thins. Nothing gets thicker from epidermal overgrowth.", mnem:"AGING = THINNING. Collagen drops, skin sags, healing slows. Nothing in aging skin gets THICKER.", trap:"Read the question: it asks for what is NOT expected. Aging thins, so any option about thickening is the answer.", src:"Quiz 6 · Attempts 1 and 2"},
    {q:"Sebaceous glands are not found ______.", opts:["on the face and scalp","palms and soles","the femoral and brachial regions","on the posterior regions"], correct:"palms and soles", hint:"Thick, hairless skin contains no sebaceous glands.", mnem:"Palms and soles are thick skin: no hair, so no sebaceous glands. 'No hair, no oil.'", trap:"Sebaceous glands exist everywhere there is hair - face, scalp, back, even the thigh. Only hairless thick skin has none.", src:"Quiz 6 · Attempts 1 and 2"},
    {q:"The rule of nines system for evaluating burns of the skin is useful for ______", opts:["the age of the patient and the need for specialty care","estimating the depth of the burn","estimating the initial IV fluid requirements and the need for specialty care / transfer","the amount of pain to be expected and its management"], correct:"estimating the initial IV fluid requirements and the need for specialty care / transfer", hint:"Burned surface area drives the fluid resuscitation volume and the transfer decision.", mnem:"The rule of nines measures AREA, and area drives FLUIDS and TRANSFER. It never measures depth or pain.", trap:"'Estimating the depth of the burn' sounds right but is wrong. Depth is graded in degrees, not in nines.", src:"Quiz 6 · Attempt 1"},
    {q:"Skin cancer is the ______ type of cancer, and due to sun exposure it occurs most frequently on the ______.", opts:["most common; hands and ears","third most common; hands and ears","most common; head and neck","third most common; head and neck"], correct:"most common; head and neck", hint:"Skin cancer is the most common cancer, and UV strikes the head and neck most often.", mnem:"SKIN cancer is the MOST common cancer, and the sun hits the HEAD and NECK first.", trap:"Hands and ears get sun too, but the keyed answer is head and neck. Also note 'most common', not 'third most common'.", src:"Quiz 6 · Attempts 1 and 2"},
    {q:"When exposed to short periods of ultraviolet light, keratinocytes convert a steroid precursor into ______, a molecule that after a few more chemical adjustments becomes calcitriol and is crucial for regulation of calcium levels.", opts:["creatine","calcidiol","calcitonin","cholecalciferol","phosphorus"], correct:"cholecalciferol", hint:"UV plus keratinocytes makes cholecalciferol, also called vitamin D3.", mnem:"UV plus keratinocytes = CHOLEcalciferol. CHOLE = cholesterol (the steroid precursor); calciferol = vitamin D3. Calcitriol comes LATER, after liver and kidney finish the job.", trap:"CALCIDIOL is the step after cholecalciferol, CALCITONIN is a hormone that lowers blood calcium, CREATINE is a muscle molecule. Near-identical words, completely different jobs.", src:"Quiz 6 · Attempt 2"},
    {q:"Keratinocytes are named for ______", opts:["their production of keratin","their production of cholecalciferol","their position within the epidermis","their resistance to keratin's drying effect","their production of keratin and melanin"], correct:"their production of keratin", hint:"The name states the job: they make keratin.", mnem:"The name is the job: KERATIN-o-cytes make KERATIN, just as melanocytes make melanin.", trap:"'Their position within the epidermis' sounds plausible, but cells are named for what they DO, not where they sit.", src:"Quiz 6 · Attempt 2"},
    {q:"What is not true of thick skin?", opts:["B and C are not true","Contains sweat gland","Contains a stratum lucidum","Contains sebaceous glands","Contains hair follicles"], correct:"B and C are not true", hint:"Thick skin does contain sweat glands and a stratum lucidum, and it lacks sebaceous glands and hair follicles. The course keys this item to the literal lettered option, so read the option letters on the real quiz.", mnem:"Thick skin HAS sweat glands and a stratum lucidum; it LACKS sebaceous glands and hair follicles. Two of the statements are false, so the keyed answer points at both by letter.", trap:"This item is letter-dependent. On the real quiz, re-read exactly which option letters the 'B and C are not true' choice is pointing at before you answer.", src:"Quiz 6 · Attempt 2"},
    {q:"Hypoxia (low blood oxygen levels) produces a bluish discoloration of the blood, skin, and mucous membranes called ______", opts:["blushing","cyanosis","jaundice","melanosis"], correct:"cyanosis", hint:"Cyan- means blue.", mnem:"CYan- means blue. CYANOSIS = 'CYAN Oasis' - blue skin from too little oxygen.", trap:"Jaundice is yellow, melanosis is brown, blushing is red. Only cyanosis is blue.", src:"Quiz 6 · Attempt 2"},
    {q:"The subcutaneous layer is a clinically useful tissue layer. What is not a characteristic of this layer?", opts:["can swell or contract due to changes in body water levels","difficult to access with a needle","easy to implant medical devices into","consists of loose areolar / adipose tissue","an excellent blood supply"], correct:"difficult to access with a needle", hint:"It is easy to reach with a needle, which is why it is a common injection site.", mnem:"The hypodermis is the EASIEST layer to reach - that is exactly why insulin and vaccines go there. Easy needle, easy implants, great blood supply.", trap:"Every other option is true, so the false one is the answer: it is EASY, not difficult, to reach with a needle.", src:"Quiz 6 · Attempt 2"},
    {q:"What changes in the skin reduce the loss of body heat?", opts:["vasoconstriction","vasodilation","vasoconstriction and sweat production","vasodilation and sweat production"], correct:"vasoconstriction", hint:"Vasoconstriction keeps warm blood away from the body surface.", mnem:"To KEEP heat: CONSTRICT the vessels and send blood deep. To LOSE heat: DILATE and sweat.", trap:"'Vasoconstriction and sweat production' is a contradiction - sweating cools you down. Constriction alone is the answer.", src:"Quiz 6 · Attempt 2"},
    {q:"The part of the hair that extends beyond the skin surface is called the ______", opts:["bulb","papilla","alopecia","shaft","root"], correct:"shaft", hint:"The shaft is above the skin; the root stays embedded in the follicle.", mnem:"The hair is an arrow. SHAFT = the part you see, ROOT = the buried part, BULB = the base.", trap:"The root and the bulb both sit below the skin. Only the shaft pokes out.", src:"Quiz 6 · Attempt 2"},
    {q:"Another name for the cuticle is the ______", opts:["nail root","hyponychium","nail matrix","eponychium"], correct:"eponychium", hint:"The eponychium is the cuticle at the base of the nail.", mnem:"EPONYCHIUM = 'EPOXY on the nail' - the cuticle. EPI = on top, ONYCH = nail.", trap:"The HYPOnychium (hypo = under) is at the free edge, and the matrix is where the nail grows. Only eponychium is the cuticle.", src:"Quiz 6 · Attempt 2"},
    {q:"Except for hairless moles, humans have the most sweat glands and the least terminal hair of any mammal. The primary function of the excess sweat glands is ______", opts:["pheromone production after puberty","parasite resistance","sodium and water regulation","skin lubrication","thermoregulation"], correct:"thermoregulation", hint:"Human sweating is mainly about cooling the body.", mnem:"Humans are the sweatiest mammal so we can run and stay cool. The job is cooling, not pheromones.", trap:"'Sodium and water regulation' really does happen when you sweat, but the PRIMARY function being tested is thermoregulation.", src:"Quiz 6 · Attempt 2"},
    {q:"Which type of thermal burn is painless and charred?", opts:["superficial, 1st degree","chemical burns","partial thickness, 2nd degree","full thickness, 3rd degree"], correct:"full thickness, 3rd degree", hint:"Third-degree burns destroy nerve endings, so they do not hurt.", mnem:"A 3rd-degree burn burned the NERVES too - no nerves, no pain, and charred skin.", trap:"Painless is the giveaway. Anything superficial or partial thickness still hurts.", src:"Quiz 6 · Attempt 2"},





    /* ---------- PowerPoint: the Module Review questions from the Ch 6 slides ---------- */
    {q:"What are the 2 layers of the skin (the cutaneous membrane)?", opts:["Epidermis and dermis", "Epidermis and hypodermis", "Dermis and hypodermis", "Papillary layer and reticular layer"], correct:"Epidermis and dermis", hint:"The skin is the epidermis on top and the dermis beneath it. The hypodermis lies under the skin and is not part of it.", mnem:"Skin = EPI + DERMIS. The HYPOdermis is UNDER the skin, so it is not one of the two layers.", trap:"Papillary and reticular are the two layers of the DERMIS, not of the skin.", src:"PowerPoint · Ch 6 Module 5.1 (slide 9)", id:"q74"},
    {q:"What makes the skin's stratified squamous epithelium tougher than any mucous membrane?", opts:["It has its own blood supply", "It is keratinized", "It contains goblet cells", "It sits directly on the hypodermis"], correct:"It is keratinized", hint:"The epidermis is KERATINIZED stratified squamous epithelium, the body's toughest epithelium. The slides call it the outdoor version.", mnem:"Keratin = armor. Mucous membranes are the indoor version with no keratin, so they stay soft and wet.", trap:"The epidermis is AVASCULAR, with no blood supply of its own. Nutrients diffuse up from the dermis.", src:"PowerPoint · Ch 6 Module 5.1 (slide 9)", id:"q75"},
    {q:"Where is the hypodermis located?", opts:["Between the epidermis and the dermis", "Superficial to the epidermis", "Deep to the dermis, anchoring the skin to muscle and bone", "Inside the stratum basale"], correct:"Deep to the dermis, anchoring the skin to muscle and bone", hint:"The hypodermis (subcutaneous layer) is deep to the dermis. It is not part of the skin and loosely anchors it to the structures beneath.", mnem:"HYPO = under. It sits under the dermis, like the padding under a carpet.", trap:"Nothing sits between the epidermis and dermis. The dermal papillae interlock directly with the epidermis.", src:"PowerPoint · Ch 6 Module 5.1 (slide 9)", id:"q76"},
    {q:"Which set lists 3 functions of the skin?", opts:["Blood cell production, protection, calcium storage", "Leverage, sensation, hematopoiesis", "Mineral storage, movement, water retention", "Protection, water retention, thermoregulation"], correct:"Protection, water retention, thermoregulation", hint:"The skin's functions include protection, water retention, a barrier to bacteria, thermoregulation, sensation, immune monitoring and a social role.", mnem:"Skin keeps things OUT (bacteria), keeps water IN, and sets the thermostat.", trap:"Blood cell production, calcium storage, leverage and movement belong to the SKELETON (Ch 7). One bone function is enough to make an option wrong.", src:"PowerPoint · Ch 6 Module 5.1 (slide 9)", id:"q77"},
    {q:"Which skin function is most important to homeostasis?", opts:["Water retention", "Thermoregulation", "Barrier to bacterial invasion", "Vitamin D synthesis"], correct:"Water retention", hint:"The slides call water retention our most important homeostatic function. The barrier to infection is second.", mnem:"Lose your skin, lose your WATER. That is why severe fluid loss kills burn patients.", trap:"Barrier to infection is a real function, but the slides rank it SECOND. Thermoregulation sounds like homeostasis, but it isn't number one.", src:"PowerPoint · Ch 6 Module 5.1 (slide 9)", id:"q78"},
    {q:"Which 2 processes occur in the dermis?", opts:["Keratin production and melanin synthesis", "Vascular support of the epidermis and sweat/sebum production", "Vitamin D3 synthesis and keratin production", "Hematopoiesis and fat storage"], correct:"Vascular support of the epidermis and sweat/sebum production", hint:"The dermis carries the capillaries that support the epidermis. It also has sensation receptors and makes sweat and sebum.", mnem:"The DERMIS is the DELIVERY layer: blood vessels, glands and nerves. The epidermis is the keratin factory.", trap:"Keratin, melanin and vitamin D3 are all EPIDERMIS processes. Hematopoiesis is red bone marrow.", src:"PowerPoint · Ch 6 Module 5.1 (slide 9)", id:"q79"},
    {q:"Name 2 cell types found in the epidermis.", opts:["Fibroblasts and adipocytes", "Osteocytes and chondrocytes", "Keratinocytes and melanocytes", "Keratinocytes and fibroblasts"], correct:"Keratinocytes and melanocytes", hint:"The epidermis has keratinocytes, melanocytes, Merkel (tactile) cells and dendritic (Langerhans) cells.", mnem:"Epidermis cells make KERATIN, MELANIN, feel touch (Merkel) and watch for germs (dendritic).", trap:"Fibroblasts and adipocytes are connective tissue cells of the dermis and hypodermis. One wrong cell makes the pair wrong.", src:"PowerPoint · Ch 6 Modules 5.2–5.3 (slide 41)", id:"q80"},
    {q:"Where is thick skin found?", opts:["Scalp and face", "Back and shoulders", "Abdomen and thighs", "Palms and soles"], correct:"Palms and soles", hint:"Thick skin covers the palms and soles (the palmar and plantar surfaces). Thin skin covers everything else.", mnem:"Thick skin is where you GRIP and STAND: hands and feet.", trap:"The back has the thickest DERMIS, but 'thick skin' means the 5-layer EPIDERMIS of palms and soles.", src:"PowerPoint · Ch 6 Modules 5.2–5.3 (slide 41)", id:"q81"},
    {q:"What are the 4 layers of thin skin?", opts:["Stratum basale, spinosum, granulosum, corneum", "Stratum basale, spinosum, lucidum, corneum", "Stratum basale, granulosum, lucidum, corneum", "Papillary, reticular, basale, corneum"], correct:"Stratum basale, spinosum, granulosum, corneum", hint:"Thin skin has every layer except the stratum lucidum, which appears in thick skin only.", mnem:"Deep to surface: 'Before Signing, Get Coffee' = Basale, Spinosum, Granulosum, Corneum. Add LUCIDUM for thick skin only.", trap:"Any option with 'lucidum' describes thick skin. Papillary and reticular are dermis layers.", src:"PowerPoint · Ch 6 Modules 5.2–5.3 (slide 41)", id:"q82"},
    {q:"Which 2 structures are found in the dermal layer?", opts:["Melanocytes and Merkel cells", "Blood vessels and sweat glands", "Stratum lucidum and keratin", "Osteons and lacunae"], correct:"Blood vessels and sweat glands", hint:"The reticular dermis holds blood vessels, hair follicles, sweat glands, sebaceous glands and lamellated (Pacinian) corpuscles.", mnem:"The dermis is the plumbing and wiring: vessels, glands, hair roots, sensors.", trap:"Melanocytes and Merkel cells sit in the stratum basale, which is EPIDERMIS.", src:"PowerPoint · Ch 6 Modules 5.2–5.3 (slide 41)", id:"q83"},
    {q:"Which dermal layer gives rise to the epidermal ridges and fingerprints?", opts:["Reticular layer", "Hypodermis", "Papillary layer", "Stratum corneum"], correct:"Papillary layer", hint:"The dermal papillae of the papillary layer push up into the epidermis and form the friction ridges.", mnem:"PAPILLARY = little PEAKS. The peaks under your fingertips print your fingerprints.", trap:"The question asks for a DERMAL layer, so the stratum corneum is out. The reticular layer is too deep to shape the surface.", src:"PowerPoint · Ch 6 Modules 5.2–5.3 (slide 41)", id:"q84"},
    {q:"Excess fluid collecting in the hypodermis is called ______.", opts:["Poor skin turgor", "Cyanosis", "Hematoma", "Edema"], correct:"Edema", hint:"Excess water in the loose hypodermis is edema. Low body water gives the opposite: poor skin turgor.", mnem:"EDEMA = swelling. Press a swollen ankle and the dent stays.", trap:"Poor turgor is DEHYDRATION, the opposite problem. A hematoma is BLOOD, not water.", src:"PowerPoint · Ch 6 Modules 5.2–5.3 (slide 41)", id:"q85"},
    {q:"What 2 factors control a person's melanin production?", opts:["Genetics and UV exposure", "Diet and hydration", "Carotene and bilirubin levels", "Age and body temperature"], correct:"Genetics and UV exposure", hint:"The amount of melanin depends on genetics and on UV exposure.", mnem:"Born with it (GENES) plus what the sun adds (UV = the tan).", trap:"Carotene and bilirubin are OTHER pigments that change skin color. They don't control melanin.", src:"PowerPoint · Ch 6 Modules 5.3–5.4 (slide 56)", id:"q86"},
    {q:"Which hemoglobin-related skin coloration is seen after exercise or a fever?", opts:["Pallor", "Flushing (erythema)", "Cyanosis", "Jaundice"], correct:"Flushing (erythema)", hint:"Warming dilates dermal blood vessels and the skin reddens. That is flushing, or erythema.", mnem:"HOT = red = FLUSH. COLD = pale = PALLOR.", trap:"Pallor is the cold response (vasoconstriction). Jaundice comes from bilirubin, not from blood flow.", src:"PowerPoint · Ch 6 Modules 5.3–5.4 (slide 56)", id:"q87"},
    {q:"The term for a bluish coloration of the skin related to cardio-respiratory failure is ______.", opts:["Jaundice", "Pallor", "Cyanosis", "Erythema"], correct:"Cyanosis", hint:"Deoxygenated blood is dark purple, so a hypoxic person turns bluish. This is usually a respiratory emergency.", mnem:"CYAN = blue. Cyanosis = blue from low oxygen.", trap:"The darker the skin, the harder cyanosis is to see. You need the person's normal hue to judge it.", src:"PowerPoint · Ch 6 Modules 5.3–5.4 (slide 56)", id:"q88"},
    {q:"Hemoglobin breaks down to bilirubin, a yellowish pigment. Excess yellowing of the skin due to bilirubin is called ______.", opts:["Carotene coloring", "Cyanosis", "Flushing", "Jaundice"], correct:"Jaundice", hint:"A build-up of bilirubin in the blood gives jaundice: dark yellow skin, seen best in the sclera of the eyes.", mnem:"JAUNE is French for yellow. Bilirubin = jaundice = liver trouble.", trap:"Carotene also turns skin yellow-orange, but it comes from food (carrots) and is harmless. It is not bilirubin.", src:"PowerPoint · Ch 6 Modules 5.3–5.4 (slide 56)", id:"q89"},
    {q:"What protein is hair made of?", opts:["Keratin", "Collagen", "Melanin", "Elastin"], correct:"Keratin", hint:"Hair is a keratin-based structure made of dead keratinized cells. Nails are keratin too.", mnem:"Hair, nails and the stratum corneum are all the same stuff: KERATIN.", trap:"Melanin COLORS hair but isn't its structural protein. Collagen is the dermis fiber.", src:"PowerPoint · Ch 6 Module 5.5 (slide 84)", id:"q90"},
    {q:"Name the 2 types of hair found on adults.", opts:["Lanugo and vellus", "Vellus and terminal", "Lanugo and terminal", "Shaft and root"], correct:"Vellus and terminal", hint:"After birth there are 2 hair types: soft, thin vellus hair over most of the body, and heavier, pigmented terminal hair.", mnem:"VELLUS = VELVET, the fine body fuzz. TERMINAL = the thick hair of the head, brows, axilla and pubic areas.", trap:"Lanugo is FETAL hair, mostly lost before or soon after birth. Shaft and root are hair PARTS, not types.", src:"PowerPoint · Ch 6 Module 5.5 (slide 84)", id:"q91"},
    {q:"Which statement describes the hair shaft?", opts:["The living base in the dermis where cells divide", "The swelling at the base that surrounds the papilla", "The part projecting from the skin surface, made of dead keratinized cells", "The smooth muscle band that makes the hair stand up"], correct:"The part projecting from the skin surface, made of dead keratinized cells", hint:"The shaft projects from the skin's surface. The root is the portion embedded in the dermis.", mnem:"Hair is an arrow. The SHAFT is the part you see, and it is dead keratin.", trap:"The living dividing cells are the MATRIX, the swelling is the BULB, and the muscle is the ARRECTOR PILI.", src:"PowerPoint · Ch 6 Module 5.5 (slide 84)", id:"q92"},
    {q:"What part of the nail is actively growing?", opts:["Nail body", "Eponychium", "Hyponychium", "Nail matrix"], correct:"Nail matrix", hint:"The nail root, under the skin, holds the nail matrix of actively dividing cells. That is where growth occurs.", mnem:"MATRIX = the MAKER. Damage it and the nail grows back split.", trap:"The nail body is the visible, finished part. The eponychium (cuticle) and hyponychium are folds of skin.", src:"PowerPoint · Ch 6 Module 5.5 (slide 84)", id:"q93"},
    {q:"Which type of sweat gland induces adults to bathe daily?", opts:["Apocrine", "Eccrine (merocrine)", "Ceruminous", "Sebaceous"], correct:"Apocrine", hint:"Apocrine glands near terminal hair (axilla, pubic areas) turn active after puberty. Bacteria digest their protein-rich sweat into body odor.", mnem:"APOcrine = 'A Pungent Odor'.", trap:"Eccrine sweat has little or no odor. Sebaceous glands make oil, not sweat.", src:"PowerPoint · Ch 6 Module 5.5 (slide 84)", id:"q94"},
    {q:"Where are sebaceous glands NOT found?", opts:["Face", "Palms and soles", "Scalp", "Back"], correct:"Palms and soles", hint:"Sebaceous glands are found everywhere except the palms and soles, with high numbers on the face and scalp.", mnem:"No hair, no oil. Palms and soles are hairless thick skin.", trap:"The face and scalp have the MOST sebaceous glands, so they are the opposite of the answer.", src:"PowerPoint · Ch 6 Module 5.5 (slide 84)", id:"q95"},
    {q:"Which burn injury type can be painless?", opts:["Superficial (1st degree)", "Partial thickness (2nd degree)", "Full thickness (3rd degree)", "Sunburn"], correct:"Full thickness (3rd degree)", hint:"Full-thickness burns destroy the dermis and its nerve endings, so they are painless and blackened.", mnem:"No nerves left = no pain. 3rd degree burns the nerves too.", trap:"1st degree (sunburn) is painful redness, and 2nd degree is painful blistering.", src:"PowerPoint · Ch 6 Module 5.6 (slide 100)", id:"q96"},
    {q:"What is the most critical problem associated with extensive skin loss?", opts:["Bacterial infection", "Loss of vitamin D production", "Pain", "Severe fluid loss"], correct:"Severe fluid loss", hint:"The greatest mortality with skin damage comes from severe fluid loss, because water retention is the skin's most important function.", mnem:"Skin's #1 job is holding water in. Lose the skin, lose the water.", trap:"Infection is serious, but the barrier to infection is the skin's SECOND most important function.", src:"PowerPoint · Ch 6 Module 5.6 (slide 100)", id:"q97"},
    {q:"What degree burn is a sunburn?", opts:["First degree (superficial)", "Second degree (partial thickness)", "Third degree (full thickness)", "It is not a burn"], correct:"First degree (superficial)", hint:"A sunburn is a superficial, 1st degree burn: painful redness only.", mnem:"Sunburn = 1st degree = red and sore, with no blisters.", trap:"UV radiation counts as a burn source. Blistering would make it 2nd degree.", src:"PowerPoint · Ch 6 Module 5.6 (slide 100)", id:"q98"},
    {q:"US Navy sailors have the highest rate of skin cancer and the lowest rate of all other cancers. What mechanism has been proposed?", opts:["Salt water kills cancer cells", "Sunburns boost the immune system", "Heavy sun exposure raises vitamin D, which may protect against other cancers", "Skin cancer uses up the body's cancer risk"], correct:"Heavy sun exposure raises vitamin D, which may protect against other cancers", hint:"The slides note that skin cancer frequency is inversely related to all other cancers and directly related to normal vitamin D levels.", mnem:"More SUN = more skin cancer, but also more VITAMIN D, and fewer other cancers.", trap:"This mechanism has never been proven, but vitamin D is the proposed link. Don't pick an option with no biology behind it.", src:"PowerPoint · Ch 6 Module 5.6 (slide 100)", id:"q100"},

    /* ---------- Homework 6, question for question. Picture and labeling questions are left out. ---------- */
    {q:"The skin is sometimes called the Cutaneous Membrane. It consists of 2 layers intimately bound to each other. The superficial part that is resistant to mild trauma and many pathogens is the ______. The deeper part that contains the blood vessels and sweat glands is the ______.", opts:["epidermis; hypodermis","dermis; hypodermis","epidermis; dermis","stratum corneum; stratum basale"], correct:"epidermis; dermis", hint:"Epidermis on top, dermis below. The hypodermis sits under the skin and is not one of its two layers.", src:"HW6 #1", id:"hw6-01"},
    {q:"List 4 functions of the integumentary system.", opts:["Protection, blood cell production, cutaneous sensation, vitamin D synthesis","Protection, body temperature regulation, cutaneous sensation, vitamin D synthesis","Protection, body temperature regulation, calcium storage, movement","Hormone storage, body temperature regulation, cutaneous sensation, blood cell production"], correct:"Protection, body temperature regulation, cutaneous sensation, vitamin D synthesis", hint:"Protection (a barrier against abrasion, water loss, UV and pathogens), temperature regulation (sweating and dermal blood flow), cutaneous sensation (touch, pressure, vibration, temperature, pain), and metabolic function (vitamin D synthesis in the stratum basale).", trap:"Blood cell production and calcium storage are skeletal functions, not skin functions.", src:"HW6 #2", id:"hw6-02"},
    {q:"If you lose a significant portion of your skin (> 25% Body surface area), which lost skin function can quickly prove fatal?", opts:["Temperature regulation","Cutaneous sensation","The barrier function - prevention of water loss","Vitamin D synthesis"], correct:"The barrier function - prevention of water loss", hint:"Catastrophic fluid and electrolyte loss causes dehydration, circulatory shock and kidney failure within hours. Infection is the next threat, but dehydration kills first.", src:"HW6 #3", id:"hw6-03"},
    {q:"By what two processes can body temperature be affected by the integumentary system (skin)?", opts:["Keratin production and melanin production","Sebum production and hair growth","Sweating and adjusting dermal blood flow","Vitamin D synthesis and calcium absorption"], correct:"Sweating and adjusting dermal blood flow", hint:"Sweating cools by evaporation. Vasodilation sheds heat and vasoconstriction conserves it.", src:"HW6 #4", id:"hw6-04"},
    {q:"List 3 processes that occur in the epidermis.", opts:["Keratinization, melanin production, and vitamin D synthesis","Sweat production, sebum production, and hair growth","Blood cell production, collagen synthesis, and fat storage","Sensation, temperature regulation, and fat storage"], correct:"Keratinization, melanin production, and vitamin D synthesis", hint:"Keratinization, melanin production, and vitamin D synthesis.", trap:"Sweat and sebum come from glands in the dermis.", src:"HW6 #5", id:"hw6-05"},
    {q:"What are the 2 processes that occur in the dermis?", opts:["Keratinization and melanin production","Vitamin D synthesis and keratinization","Sensation and temperature regulation","Hair and nail formation"], correct:"Sensation and temperature regulation", hint:"Sensation (receptors for touch, pressure, temperature and pain) and temperature regulation (blood flow through the dermal vascular plexuses).", src:"HW6 #6", id:"hw6-06"},
    {q:"List 3 cell types that reside in the epidermis only.", opts:["Fibroblasts, mast cells, and macrophages","Keratinocytes, melanocytes, and dendritic (Langerhans) cells","Osteocytes, chondrocytes, and adipocytes","Keratinocytes, fibroblasts, and adipocytes"], correct:"Keratinocytes, melanocytes, and dendritic (Langerhans) cells", hint:"Keratinocytes, melanocytes, and dendritic (Langerhans) cells. A fourth also qualifies: tactile (Merkel) cells.", trap:"Fibroblasts, mast cells and macrophages live in the dermis.", src:"HW6 #7", id:"hw6-07"},
    {q:"Which epidermal cell type is related to the immune system?", opts:["Keratinocytes","Melanocytes","Tactile (Merkel) cells","Dendritic (Langerhans) cells"], correct:"Dendritic (Langerhans) cells", hint:"The dendritic (Langerhans) cell - a macrophage-family cell that patrols the stratum spinosum and presents antigen.", src:"HW6 #8", id:"hw6-08"},
    {q:"List the 5 layers of thick skin.", opts:["Stratum basale, granulosum, spinosum, lucidum, corneum","Stratum basale, spinosum, lucidum, granulosum, corneum","Stratum basale, spinosum, granulosum, lucidum, corneum","Stratum basale, spinosum, granulosum, corneum, reticular"], correct:"Stratum basale, spinosum, granulosum, lucidum, corneum", hint:"Deep to superficial: stratum basale (germinativum), spinosum, granulosum, lucidum, corneum.", trap:"Check which direction the question asks for. Superficial to deep is the same list backwards.", src:"HW6 #9", id:"hw6-09"},
    {q:"Of the 5 layers of thick skin, which layer is not present in thin skin?", opts:["Stratum basale","Stratum granulosum","Stratum spinosum","Stratum lucidum"], correct:"Stratum lucidum", hint:"Stratum lucidum.", src:"HW6 #10", id:"hw6-10"},
    {q:"What are the only 2 body regions where thick skin is found?", opts:["The scalp and the back","The elbows and the knees","The palms of the hands and the soles of the feet","The face and the neck"], correct:"The palms of the hands and the soles of the feet", hint:"The palms of the hands (including fingertips) and the soles of the feet.", src:"HW6 #11", id:"hw6-11"},
    {q:"The hypodermis is also known as the ______ layer.", opts:["subcutaneous","reticular","papillary","basal"], correct:"subcutaneous", hint:"Subcutaneous layer - also called the superficial fascia.", src:"HW6 #12", id:"hw6-12"},
    {q:"Hypodermic injections are given into what region below the skin?", opts:["The reticular layer of the dermis","The hypodermis (subcutaneous layer)","The papillary layer of the dermis","The stratum basale"], correct:"The hypodermis (subcutaneous layer)", hint:"The hypodermis - the subcutaneous layer of loose areolar and adipose tissue.", src:"HW6 #18", id:"hw6-13"},
    {q:"Two types of sensory receptors found in the skin that detect fine touch are:", opts:["Lamellated (Pacinian) corpuscles and free nerve endings","Nociceptors and thermoreceptors","Lamellated (Pacinian) corpuscles and Merkel discs","Tactile (Merkel) discs and tactile (Meissner's) corpuscles"], correct:"Tactile (Merkel) discs and tactile (Meissner's) corpuscles", hint:"Tactile (Merkel) discs and tactile (Meissner's) corpuscles.", trap:"Pacinian corpuscles are deep pressure and vibration, not fine touch.", src:"HW6 #19", id:"hw6-14"},
    {q:"Which sensory receptor senses pressure, vibration, and maybe music and only found in the Dermis layer?", opts:["Tactile (Merkel) disc","Tactile (Meissner's) corpuscle","Lamellated (Pacinian) corpuscle","Free nerve ending"], correct:"Lamellated (Pacinian) corpuscle", hint:"The lamellated (Pacinian) corpuscle - the onion-slice structure deep in the reticular dermis.", src:"HW6 #20", id:"hw6-15"},
    {q:"The papillary layer is the more (superficial / deep) dermal layer and is made up of ______ (connective tissue type).", opts:["deep; dense irregular connective tissue","superficial; dense irregular connective tissue","superficial; areolar (loose) connective tissue","deep; areolar (loose) connective tissue"], correct:"superficial; areolar (loose) connective tissue", hint:"Superficial, and made of areolar (loose) connective tissue.", src:"HW6 #21", id:"hw6-16"},
    {q:"The Reticular layer is the (superficial / deep) dermal layer and is made up of ______ (connective tissue type).", opts:["superficial; areolar (loose) connective tissue","deep; areolar (loose) connective tissue","deep; dense irregular connective tissue","superficial; dense irregular connective tissue"], correct:"deep; dense irregular connective tissue", hint:"Deep, and made of dense irregular connective tissue.", src:"HW6 #22", id:"hw6-17"},
    {q:"Finger prints are anatomically called: ______", opts:["dermal papillae","cleavage lines","friction ridges (epidermal ridges)","flexure lines"], correct:"friction ridges (epidermal ridges)", hint:"Friction ridges (epidermal ridges).", src:"HW6 #24", id:"hw6-18"},
    {q:"Which layer of the dermis contributes to a person's finger print?", opts:["The reticular layer","The papillary layer","The hypodermis","The stratum corneum"], correct:"The papillary layer", hint:"The papillary layer - its dermal papillae throw the epidermis into ridges, so the pattern is dermal in origin and regrows identically after surface injury.", src:"HW6 #25", id:"hw6-19"},
    {q:"The primary difference between the stratified squamous epithelium of skin and mucous membrane is that skin is ______", opts:["ciliated","mucus-producing","simple rather than stratified","keratinized (and therefore dry)"], correct:"keratinized (and therefore dry)", hint:"Keratinized (and therefore dry) - mucous membranes are non-keratinized and kept moist.", src:"HW6 #26", id:"hw6-20"},
    {q:"Vasodilation or hyperemia (flushing) of the skin (gains / loses) heat from the body.", opts:["gains","loses","neither gains nor loses","traps"], correct:"loses", hint:"Loses heat - warm blood is brought to the surface where it radiates away.", src:"HW6 #27", id:"hw6-21"},
    {q:"The primary pigment of skin which is increased with UV exposure is ______", opts:["melanin","carotene","hemoglobin","bilirubin"], correct:"melanin", hint:"Melanin.", src:"HW6 #28", id:"hw6-22"},
    {q:"The skin color condition where light-skinned people turn blue when they can't get enough oxygen in their lungs is called ______", opts:["jaundice","pallor","cyanosis","erythema"], correct:"cyanosis", hint:"Cyanosis.", src:"HW6 #29", id:"hw6-23"},
    {q:"The yellow orange pigment which can build up in the skin in fair skinned infants due to eating excessive carrots and squash baby food is ______", opts:["bilirubin","melanin","carotene","hemoglobin"], correct:"carotene", hint:"Carotene - the condition is carotenemia. Harmless, and the sclerae stay white, which distinguishes it from jaundice.", src:"HW6 #30", id:"hw6-24"},
    {q:"The disease where the sclera (white areas) of the eyes turn yellow due to bile duct obstruction or liver failure is called ______", opts:["carotenemia","jaundice","cyanosis","albinism"], correct:"jaundice", hint:"Jaundice (icterus).", src:"HW6 #31", id:"hw6-25"},
    {q:"Which vitamin is produced in the Stratum Basale in response to any UV exposure?", opts:["Vitamin A","Vitamin D (cholecalciferol, vitamin D3)","Vitamin C","Vitamin K"], correct:"Vitamin D (cholecalciferol, vitamin D3)", hint:"Vitamin D (cholecalciferol, vitamin D3).", src:"HW6 #32", id:"hw6-26"},
    {q:"Vitamin D is important in maintaining homeostasis because it controls ______", opts:["glucose uptake by cells","sodium reabsorption in the kidney","red blood cell production","calcium absorption from the intestine, and therefore blood calcium levels"], correct:"calcium absorption from the intestine, and therefore blood calcium levels", hint:"Calcium absorption from the intestine - and therefore blood calcium levels, which govern bone mineralization, nerve impulses, muscle contraction and blood clotting.", src:"HW6 #33", id:"hw6-27"},
    {q:"The layer of Loose areolar CT tissue deep to the dermis is termed the ______.", opts:["hypodermis (subcutaneous layer)","reticular layer","papillary layer","stratum basale"], correct:"hypodermis (subcutaneous layer)", hint:"Hypodermis (subcutaneous layer / superficial fascia).", src:"HW6 #34", id:"hw6-28"},
    {q:"Oxygen and nutrients are provided to the epidermis by capillaries in the ______", opts:["hypodermis","dermal papillae of the papillary layer of the dermis","reticular layer of the dermis","stratum basale"], correct:"dermal papillae of the papillary layer of the dermis", hint:"Dermal papillae of the papillary layer of the dermis. The epidermis is avascular and lives entirely on diffusion from below.", src:"HW6 #35", id:"hw6-29"},
    {q:"What primary protein makes up hair, nails and the stratum corneum?", opts:["Collagen","Elastin","Melanin","Keratin"], correct:"Keratin", hint:"Keratin.", src:"HW6 #36", id:"hw6-30"},
    {q:"What type of hair remains fine and unpigmented?", opts:["Terminal hair","Lanugo","Scalp hair","Vellus hair"], correct:"Vellus hair", hint:"Vellus hair - the peach fuzz covering most of the body. The coarse pigmented type is terminal hair.", src:"HW6 #37", id:"hw6-31"},
    {q:"List 2 types of sweat glands.", opts:["Eccrine (merocrine) and apocrine","Sebaceous and ceruminous","Eccrine and sebaceous","Mammary and sebaceous"], correct:"Eccrine (merocrine) and apocrine", hint:"Eccrine (merocrine) and apocrine.", trap:"Sebaceous glands make oil, not sweat.", src:"HW6 #38", id:"hw6-32"},
    {q:"List 2 sweat-related glands that produce other materials besides sweat.", opts:["Sebaceous glands and apocrine glands","Eccrine glands and merocrine glands","Ceruminous glands (earwax) and mammary glands (milk)","Lacrimal glands and salivary glands"], correct:"Ceruminous glands (earwax) and mammary glands (milk)", hint:"Ceruminous glands (earwax) and mammary glands (milk) - both are modified apocrine sweat glands.", src:"HW6 #39", id:"hw6-33"},
    {q:"Which sweat gland type is the most numerous and therefore most important?", opts:["Apocrine","Eccrine (merocrine)","Sebaceous","Ceruminous"], correct:"Eccrine (merocrine)", hint:"Eccrine (merocrine) - millions of them, densest on the palms, soles and forehead, and the ones that do thermoregulation.", src:"HW6 #40", id:"hw6-34"},
    {q:"Which type of sweat gland puts out a foul smelling, nearly useless sweat that must be washed off frequently in adults?", opts:["Apocrine","Eccrine (merocrine)","Sebaceous","Ceruminous"], correct:"Apocrine", hint:"Apocrine - axillary and anogenital regions. The secretion is odorless until skin bacteria break it down.", src:"HW6 #41", id:"hw6-35"},
    {q:"Which hormone stimulates more sebaceous gland output?", opts:["Estrogen","Insulin","Androgens (testosterone)","Thyroxine"], correct:"Androgens (testosterone)", hint:"Androgens - testosterone. The surge at puberty is why acne starts then.", src:"HW6 #44", id:"hw6-36"},
    {q:"Besides thermal burns, name 2 other ways to burn your skin.", opts:["Frostbite and abrasions","Friction and pressure","Chemical burns and electrical burns","Lacerations and contusions"], correct:"Chemical burns and electrical burns", hint:"Chemical burns (strong acids or bases) and electrical burns. Radiation burns also count.", src:"HW6 #47", id:"hw6-37"},
    {q:"A 1st degree burn is a ______ burn. It is (painful/painless) and (has/has no) blisters.", opts:["superficial; painless; has blisters","superficial; painful; has no blisters","partial thickness; painful; has blisters","full thickness; painless; has no blisters"], correct:"superficial; painful; has no blisters", hint:"A 1st degree burn is a superficial burn. It is painful and has no blisters. (Epidermis only.)", src:"HW6 #48", id:"hw6-38"},
    {q:"A 2nd degree burn is a ______ thickness burn. It is (painful/painless) and (has/has no) blisters.", opts:["partial thickness; painful; has blisters","superficial; painful; has no blisters","full thickness; painless; has no blisters","partial thickness; painless; has no blisters"], correct:"partial thickness; painful; has blisters", hint:"A 2nd degree burn is a partial thickness burn. It is painful and has blisters. (Epidermis + upper dermis.)", src:"HW6 #48", id:"hw6-39"},
    {q:"A 3rd degree burn is a ______ thickness burn. It is (painful/painless) and (has/has no) blisters.", opts:["full thickness; painful; has blisters","partial thickness; painful; has blisters","full thickness; painless; has no blisters","superficial; painful; has no blisters"], correct:"full thickness; painless; has no blisters", hint:"A 3rd degree burn is a full thickness burn. It is painless and has no blisters. (Through the dermis into the hypodermis.)", src:"HW6 #48", id:"hw6-40"},
    {q:"Which degree burn put the patient at greatest risk of fluid loss?", opts:["Third degree (full thickness)","First degree (superficial)","Second degree (partial thickness)","All degrees carry the same risk"], correct:"Third degree (full thickness)", hint:"Third degree (full thickness) - the entire barrier is gone across the burned area, so plasma pours out unchecked.", src:"HW6 #49", id:"hw6-41"},
    {q:"The Rule of Nines is a quick, but possibly inaccurate method of estimating the extent of a burn. What is the importance of estimating a patient's burned areas?", opts:["It determines how deep the burn is","It determines how much pain to expect","It determines how much IV fluid to give and whether to transfer to a burn center","It determines the patient's age and weight"], correct:"It determines how much IV fluid to give and whether to transfer to a burn center", hint:"It determines whether the burn is critical: how much IV fluid to give (calculated from %BSA and body weight), whether to transfer to a burn center, and the infection risk and mortality estimate.", src:"HW6 #50", id:"hw6-42"},
    {q:"A patient presents with 2nd degree burns to both sides of both arms. What % Body Surface Area would you estimate?", opts:["18%","9%","27%","36%"], correct:"18%", hint:"18%. By the Rule of Nines one entire arm, front and back, is 9%, so 9 + 9 = 18%.", src:"HW6 #51", id:"hw6-43"},
    {q:"The most important environmental factor leading to cancer of the skin is ______.", opts:["Chemical exposure","Viral infection","Smoking","UV radiation (sun exposure and tanning beds)"], correct:"UV radiation (sun exposure and tanning beds)", hint:"UV radiation - sun exposure (and tanning beds).", src:"HW6 #52", id:"hw6-44"},
    {q:"List 3 types of skin cancers caused by UV exposure.", opts:["Basal cell carcinoma, osteosarcoma, and melanoma","Squamous cell carcinoma, lymphoma, and melanoma","Melanoma, leukemia, and basal cell carcinoma","Basal cell carcinoma, squamous cell carcinoma, and melanoma"], correct:"Basal cell carcinoma, squamous cell carcinoma, and melanoma", hint:"Basal cell carcinoma, squamous cell carcinoma, and melanoma.", src:"HW6 #53", id:"hw6-45"}
  ]
},

q7: {
  label: "Chapter 7 — Osseous Tissue",
  mcq: [
    /* ---------- Real Quiz 7 test bank (20 items) ---------- */
    {q:"Which of the following is not a function of the skeletal system?", opts:["body support","protection of internal organs","hematopoiesis","energy production"], correct:"energy production", hint:"Bone supports, protects and makes blood cells; it does not make energy.", mnem:"Bone SUPPORTS, PROTECTS, MOVES, STORES minerals and MAKES blood cells. Energy production is the job of metabolism.", trap:"Hematopoiesis means blood cell production - that IS a skeletal function. Energy production is not.", src:"Quiz 7 · Bank"},
    {q:"The proximal and distal ends of a long bone are called the ______", opts:["Metaphyses","Diaphyses","Epiphyseal plates","Epiphyses"], correct:"Epiphyses", hint:"Epi- means upon or at the end.", mnem:"EPIPHYSIS = 'EPI on top' (and at the bottom) = the ends. DIA = through = the shaft in the middle.", trap:"The metaphysis is the zone between them and the epiphyseal plate is the growth cartilage inside it. The ENDS are epiphyses.", src:"Quiz 7 · Bank"},
    {q:"When classified by shape, carpal bones are examples of ______ bones.", opts:["irregular","sesamoid","short","flat"], correct:"short", hint:"Wrist bones are small and cube-like.", mnem:"Carpals and tarsals are SHORT: small, cube-like, built for gliding. 'Wrist and ankle = short and stable.'", trap:"The patella is sesamoid and the vertebrae are irregular. Carpal = short.", src:"Quiz 7 · Bank"},
    {q:"The cells that secrete the organic bone matrix, osteoid, prior to laying down new bone are called ______", opts:["osteocytes","osteoblasts","osteons","osteoclasts"], correct:"osteoblasts", hint:"The suffix -blast means builder.", mnem:"BLAST = BUILD. OsteoBLAST builds OSTEOid. (CLAST = chew.)", trap:"Osteocytes are mature cells that MAINTAIN the matrix - they do not build new bone. Osteons are structures, not cells.", src:"Quiz 7 · Bank"},
    {q:"The connective tissue layer covering the outer surface of all bones, though not present at any joint surface, is called the ______", opts:["endosteum","periosteum","lamellae","ligament"], correct:"periosteum", hint:"Peri- means around; it is the outer fibrous covering.", mnem:"PERI = around, OSTEUM = bone. Around the bone. ENDOsteum lines the inside.", trap:"A ligament connects bone to bone and lamellae are layers of matrix. The outer covering is the periosteum.", src:"Quiz 7 · Bank"},
    {q:"The circular-shaped structural units of compact bone found in a long bone's diaphysis are called ______", opts:["Osteons","osteocytes","trabeculae","canaliculi"], correct:"Osteons", hint:"The Haversian system is the circular unit.", mnem:"OSTEON = the target-shaped unit with a central canal. Compact bone is built out of them.", trap:"Canaliculi are the tiny connecting channels and trabeculae are the struts of spongy bone. The circular unit is the osteon.", src:"Quiz 7 · Bank"},
    {q:"Collagen fibers function to ______", opts:["provide the glue that binds the minerals together","resist compressive forces","trap water in the extracellular matrix","resist fracturing with twisting and stretching"], correct:"resist fracturing with twisting and stretching", hint:"Hydroxyapatite resists compression; collagen resists twisting and stretching.", mnem:"MINERAL resists COMPRESSION (pushing). COLLAGEN resists TWISTING and TENSION (pulling). Two materials, two strengths.", trap:"Compressive strength comes from hydroxyapatite, not collagen. Do not flip the pair.", src:"Quiz 7 · Bank"},
    {q:"The cells responsible for longitudinal growth in long bones are the ______", opts:["Chondrocytes within the osteons","Osteoblasts within the periosteum","Chondrocytes in the epiphyseal plate","Osteoclasts within the epiphysis"], correct:"Chondrocytes in the epiphyseal plate", hint:"The growth plate is cartilage cells dividing.", mnem:"Length comes from CARTILAGE (chondrocytes) dividing in the growth plate. Width comes from bone added at the periosteum.", trap:"Osteoblasts in the periosteum add WIDTH, not length. Longitudinal growth is chondrocytes.", src:"Quiz 7 · Bank"},
    {q:"Long bones are different from all other bones because they contain ______", opts:["compact bone","spongy bone","a marrow cavity","bone marrow"], correct:"a marrow cavity", hint:"Only long bones have a medullary (marrow) cavity.", mnem:"Only LONG bones have a MEDULLARY (marrow) cavity. Long bones are the hollow ones.", trap:"Compact bone, spongy bone and marrow are in EVERY bone. The cavity is what is unique to long bones.", src:"Quiz 7 · Bank"},
    {q:"A patient presents with severe anemia (low red blood cell counts). The best site to access his blood-forming cells is the ______", opts:["periosteum","endosteum","red marrow","yellow marrow"], correct:"red marrow", hint:"Red marrow performs hematopoiesis.", mnem:"RED = BLOOD. Red marrow makes blood cells. YELLOW = FAT, and it makes nothing.", trap:"Yellow marrow is plentiful in adult long bones, but it is fat storage. Blood cells come from red marrow.", src:"Quiz 7 · Bank"},
    {q:"The majority of the material and weight in osseous tissue is ______", opts:["the cells","the osteoid","the extra cellular matrix","the red marrow"], correct:"the extra cellular matrix", hint:"Most of bone's mass is the mineralized matrix, not cells.", mnem:"Bone is mostly MATRIX, not cells - about 2 percent cells and 98 percent matrix. That is why it feels like stone.", trap:"Cells, osteoid and marrow all sound substantial, but the extracellular matrix dominates the weight.", src:"Quiz 7 · Bank"},
    {q:"Which bone-related cells are multi-nucleated and can digest or resorb bone tissue?", opts:["osteoblasts","osteoclasts","osteocytes","osteogenic cells"], correct:"osteoclasts", hint:"The suffix -clast means break down; they are macrophage-like.", mnem:"CLAST = CRASH. Osteoclasts crush bone, and they are big and multi-nucleated because digesting bone takes strength.", trap:"Osteoblasts build, osteocytes maintain, osteogenic cells are the stem cells. Only osteoclasts resorb bone.", src:"Quiz 7 · Bank"},

    {q:"The patella bone is classified as a ______ type bone.", opts:["short","long","sesamoid","irregular"], correct:"sesamoid", hint:"The kneecap forms inside a tendon.", mnem:"SESAMOID = 'a SESAME seed in a bun' - a bone that forms inside a tendon. The patella is the biggest one.", trap:"The patella looks flat and shields the knee, but by classification it is sesamoid because it develops inside the quadriceps tendon.", src:"Quiz 7 · Bank"},
    {q:"What is the central canal of the osteons filled with?", opts:["osteocytes","periosteum","extra cellular matrix","blood vessels and nerves"], correct:"blood vessels and nerves", hint:"It is the neurovascular canal.", mnem:"The central canal is the bone's circulation route: BLOOD VESSELS and NERVES. Bone is alive, so it needs both.", trap:"Osteocytes sit in lacunae AROUND the canal, not inside it. The canal itself carries vessels and nerves.", src:"Quiz 7 · Bank"},
    {q:"Which type of ossification starts as islands of osteogenic cells producing spicules of bony tissue in embryonic and fetal dermal tissue?", opts:["endochondral","intramembranous","appositional","secondary"], correct:"intramembranous", hint:"Bone forms directly within a membrane, as in the flat skull bones.", mnem:"INTRA-MEMBRANOUS = 'bony islands INSIDE a MEMBRANE'. The flat skull bones and clavicles form this way.", trap:"Endochondral means 'inside cartilage', which is how long bones form. Spicules directly in mesenchyme is intramembranous.", src:"Quiz 7 · Bank"},
    {q:"Which hormone is most important to bone growth in males after puberty?", opts:["thyroid","estrogen","testosterone","growth"], correct:"testosterone", hint:"The male sex hormone.", mnem:"After puberty, males grow because TESTOSTERONE surges. The male growth spurt is testosterone driven.", trap:"Growth hormone matters, but the keyed post-puberty male driver is testosterone. Estrogen is the corresponding female hormone.", src:"Quiz 7 · Bank"},
    {q:"A condition in which a person's bones become weakened to the point of suffering spontaneous fractures is called ______", opts:["osteopenia","osteoporosis","osteomyelitis","osteitis"], correct:"osteoporosis", hint:"Osteo- plus porous means fragile, porous bone.", mnem:"OSTEO-POROSIS = bones full of PORES. Holes make them fragile. OsteoPENIA is the milder stage right before it.", trap:"Osteopenia is low bone mass but not yet fracture-prone, and osteomyelitis is an infection. Spontaneous fractures = osteoporosis.", src:"Quiz 7 · Bank"},
    {q:"The type of ossification done by osteoblasts in the periosteum around all bones throughout life is called ______", opts:["Appositional","Intramembranous","Endochondral","Osteomalacia"], correct:"Appositional", hint:"New layers are added to the outside, which increases width.", mnem:"APPOSITIONAL = 'APPositional growth'. New bone is APPOSED (added) to the OUTSIDE surface, widening the bone.", trap:"Intramembranous and endochondral are the two developmental paths. Lifelong widening by the periosteum is appositional.", src:"Quiz 7 · Bank"},
    {q:"This type of bone tissue found in the center of all bones, but not in the marrow cavity regions, is known as ______", opts:["compact or dense","osteons","epiphyseal","spongy or trabecular"], correct:"spongy or trabecular", hint:"Trabeculae fill the bone ends (epiphyses), not the shaft cavity.", mnem:"SPONGY bone fills the bone ENDS around the marrow cavity. If it is not in the cavity, it is trabecular.", trap:"Compact bone forms the outer shell and the wall of the shaft. The center and the ends are spongy.", src:"Quiz 7 · Bank"},
    {q:"Parathyroid hormone (PTH) is secreted in response to ______", opts:["high blood calcium ion levels","high levels of vitamin D","low blood calcium ion levels","ingestion of calcium-rich foods"], correct:"low blood calcium ion levels", hint:"PTH raises calcium, so it is triggered when calcium is too low.", mnem:"PTH = 'Push Total calcium Higher'. It is released when calcium is LOW, and it pulls calcium out of bone into blood.", trap:"Do not flip it. Calcitonin answers HIGH calcium, PTH answers LOW calcium.", src:"Quiz 7 · Bank"},



    /* ---------- PowerPoint: the Module Review questions from the Ch 7 slides ---------- */
    {q:"Which set lists 3 functions of the skeleton?", opts:["Support, mineral storage, blood cell formation", "Thermoregulation, water retention, vitamin D synthesis", "Excretion, sensation, pigment production", "Water retention, support, sensation"], correct:"Support, mineral storage, blood cell formation", hint:"Skeletal functions are support and framework, mineral storage (Ca and P), leverage and movement, blood cell production, and protection of organs.", mnem:"Bones HOLD you up, STORE calcium, MAKE blood, and PROTECT organs.", trap:"Thermoregulation, water retention and sensation are SKIN functions (Ch 6). One skin function makes the whole option wrong.", src:"PowerPoint · Ch 7 Module 6.1 (slide 32)", id:"q50"},
    {q:"What are 3 classes of bones based on shape?", opts:["Compact, spongy, and trabecular", "Long, short, and flat", "Diaphysis, epiphysis, and marrow cavity", "Osteons, lamellae, and trabeculae"], correct:"Long, short, and flat", hint:"Shape classes are long, short, flat, irregular, sesamoid, and sutural.", mnem:"Shape classes describe the WHOLE bone as you'd hold it: long, short, flat, irregular.", trap:"Compact and spongy are TISSUE types. Diaphysis and epiphysis are PARTS of a long bone.", src:"PowerPoint · Ch 7 Module 6.1 (slide 32)", id:"q51"},
    {q:"Name 2 things that long bones have that all other bone classes lack.", opts:["A periosteum and an endosteum", "Compact bone and spongy bone", "A marrow cavity and osteons", "Red bone marrow and a periosteum"], correct:"A marrow cavity and osteons", hint:"Only long bones have diaphyses, epiphyses, a marrow cavity, epiphyseal plates and lines, and osteons.", mnem:"Only a LONG bone is a hollow tube: shaft, ends, cavity, and osteons in the shaft wall.", trap:"EVERY bone has a periosteum, an endosteum, compact bone outside and spongy bone inside.", src:"PowerPoint · Ch 7 Module 6.1 (slide 32)", id:"q52"},
    {q:"What is the function of red bone marrow?", opts:["Storing fat", "Storing calcium crystals", "Forming cartilage for new bone", "Forming all blood cell types (hematopoiesis)"], correct:"Forming all blood cell types (hematopoiesis)", hint:"Red bone marrow is loose areolar tissue filled with islands of hematopoietic stem cells. It makes all blood cell types.", mnem:"RED marrow makes RED (and white) cells. YELLOW marrow is fat.", trap:"Fat storage is YELLOW marrow, and calcium is stored in the inorganic matrix.", src:"PowerPoint · Ch 7 Module 6.1 (slide 32)", id:"q53"},
    {q:"Which single class of bones has a marrow cavity?", opts:["Long bones", "Flat bones", "Short bones", "Irregular bones"], correct:"Long bones", hint:"The marrow cavity sits in the center of the diaphysis, and only long bones have one.", mnem:"A long bone is a hollow pipe, and the hollow is the marrow cavity.", trap:"Flat, short and irregular bones still contain bone marrow, but in spongy bone, with no 'cavity'.", src:"PowerPoint · Ch 7 Module 6.1 (slide 32)", id:"q54"},
    {q:"What does the process of hematopoiesis refer to?", opts:["Forming new bone", "Making all blood cells", "Depositing calcium salts in tissue", "Breaking down old bone"], correct:"Making all blood cells", hint:"Hematopoiesis is the formation of all blood cell types, which happens in red bone marrow.", mnem:"HEMATO = blood, POIESIS = making.", trap:"Forming bone is OSSIFICATION, depositing calcium is CALCIFICATION, and breaking bone down is RESORPTION.", src:"PowerPoint · Ch 7 Module 6.1 (slide 32)", id:"q55"},
    {q:"What are the primary ions used to make bone structure rigid?", opts:["Sodium and chloride", "Potassium and magnesium", "Calcium and phosphate", "Iron and calcium"], correct:"Calcium and phosphate", hint:"Calcium (Ca++) and phosphate (PO4) form hydroxyapatite crystals, the hardest substance in the body.", mnem:"Bone = CALCIUM PHOSPHATE = hydroxyapatite.", trap:"Magnesium is also found in bone, but its role is unclear. It is not one of the primary pair.", src:"PowerPoint · Ch 7 Module 6.1 (slide 32)", id:"q56"},
    {q:"Where is compact bone found that does NOT contain osteons?", opts:["The diaphysis of long bones", "The trabeculae of spongy bone", "The lining of the marrow cavity", "The outer layer of short, flat, irregular, and sesamoid bones"], correct:"The outer layer of short, flat, irregular, and sesamoid bones", hint:"All bones have compact bone outside, but osteons are found only in long bone diaphyses. Non-long bones have compact bone with no osteons.", mnem:"Osteons live only in the long bone SHAFT. Everywhere else, compact bone has none.", trap:"The diaphysis is exactly where osteons ARE. Trabeculae are spongy bone, not compact.", src:"PowerPoint · Ch 7 Module 6.2 (slide 58)", id:"q57"},
    {q:"What percent of a bone's weight is due to the cells?", opts:["About 2%", "About 65%", "About 25%", "About 50%"], correct:"About 2%", hint:"Bone is mostly extracellular matrix. The calcium salts are about 65% of the weight, and the cells (osteocytes) only about 2%.", mnem:"Bone is almost all matrix. The cells are a tiny 2%.", trap:"65% is the INORGANIC matrix (calcium salts), not the cells.", src:"PowerPoint · Ch 7 Module 6.2 (slide 58)", id:"q58"},
    {q:"What is the primary salt or mineral of bone?", opts:["Calcium carbonate", "Hydroxyapatite (calcium phosphate)", "Sodium chloride", "Magnesium sulfate"], correct:"Hydroxyapatite (calcium phosphate)", hint:"Calcium and phosphate exist as large hydroxyapatite crystals, Ca10(PO4)6(OH)2.", mnem:"HYDROXY-APATITE: bone's crystal is calcium PHOSPHATE.", trap:"Calcium carbonate is chalk and seashells, not bone.", src:"PowerPoint · Ch 7 Module 6.2 (slide 58)", id:"q59"},
    {q:"Will serum calcium rise or fall if osteoclast bone resorption is stimulated?", opts:["Fall", "Stay the same", "Rise", "Fall, then rise permanently"], correct:"Rise", hint:"Osteoclasts dissolve bone matrix and release Ca++ and phosphate into the blood, which raises serum calcium.", mnem:"OsteoCLASTS CLEAR bone, and the calcium goes INTO the blood.", trap:"OsteoBLASTS BUILD bone and USE serum Ca++. Don't swap them.", src:"PowerPoint · Ch 7 Module 6.2 (slide 58)", id:"q60"},
    {q:"Where exactly are osteons found?", opts:["In the spongy bone of all bones", "In the epiphyseal plates", "In the compact bone of flat bones", "In the compact bone of long bone diaphyses"], correct:"In the compact bone of long bone diaphyses", hint:"Osteons are the cylinder-like units of compact bone, seen only in long bone diaphyses.", mnem:"Osteons are long, like the bone they're in: they run along the SHAFT.", trap:"Flat bones have compact bone, but no osteons. Spongy bone is built of trabeculae.", src:"PowerPoint · Ch 7 Module 6.2 (slide 58)", id:"q61"},
